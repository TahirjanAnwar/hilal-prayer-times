<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src https://verses.quran.com; connect-src 'none'">
  <title>Hilal Prayer Times</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="widget">
  <!-- The whole card can be dragged; the logo is a button that opens the app. -->
  <div class="w-card" id="card">
    <div class="w-top">
      <button type="button" class="w-logo" id="open"><img src="../assets/logo.svg" alt=""></button>
      <div class="w-text">
        <div class="w-label"><span id="label"></span> · <span id="clock" dir="ltr"></span></div>
        <div class="w-name" id="name">—</div>
      </div>
      <div class="w-side">
        <div class="w-count" id="count" dir="ltr">--:--:--</div>
        <div class="w-wx" id="wx" hidden></div>
      </div>
    </div>
    <div class="w-ram" id="ram" hidden></div>
    <div class="w-wisdom" id="wisdom" hidden>
      <div class="w-block">
        <div class="w-hadith" id="hadith"></div>
        <div class="w-src" id="hadithSrc"></div>
      </div>
      <div class="w-block">
        <!-- The button sits in the normal flow of the row: a button placed with
             position:absolute stays part of the window's drag area and cannot be clicked. -->
        <div class="w-dua-row">
          <button type="button" class="w-play" id="duaPlay" aria-label="Play">
            <svg viewBox="0 0 24 24"><path class="i-play" d="M8 5.5v13l11-6.5z"/><path class="i-pause" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
          </button>
          <div class="w-dua-ar" id="duaAr" dir="rtl" lang="ar"></div>
          <button type="button" class="w-speed" id="duaSpeed" dir="ltr" aria-label="Playing speed">1×</button>
        </div>
        <div class="w-dua-tr" id="duaTr" dir="ltr" lang="en"></div>
        <div class="w-dua" id="dua"></div>
        <div class="w-src" id="duaSrc"></div>
        <div class="w-note" id="duaNote" hidden></div>
      </div>
    </div>
  </div>
  <audio id="duaAudio" preload="none"></audio>
  <script src="hijri.js"></script>
  <script src="weather.js"></script>
  <script src="wisdom.js"></script>
  <script src="widget.js"></script>
</body>
</html>
