<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Hilal Prayer Times</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="widget">
  <!-- The whole card can be dragged; the logo is a button that opens the app. -->
  <div class="w-card" id="card">
    <div class="w-top">
      <button type="button" class="w-logo" id="open"><img src="../assets/logo.svg" alt=""></button>
      <div class="w-text">
        <div class="w-label"><span id="label"></span> · <span id="clock" dir="ltr"></span></div>
        <div class="w-name" id="name">—</div>
      </div>
      <div class="w-count" id="count" dir="ltr">--:--:--</div>
    </div>
    <div class="w-ram" id="ram" hidden></div>
    <div class="w-wisdom" id="wisdom" hidden>
      <div class="w-block">
        <div class="w-hadith" id="hadith"></div>
        <div class="w-src" id="hadithSrc"></div>
      </div>
      <div class="w-block">
        <div class="w-dua-ar" id="duaAr" dir="rtl" lang="ar"></div>
        <div class="w-dua" id="dua"></div>
        <div class="w-src" id="duaSrc"></div>
      </div>
    </div>
  </div>
  <script src="hijri.js"></script>
  <script src="wisdom.js"></script>
  <script src="widget.js"></script>
</body>
</html>
