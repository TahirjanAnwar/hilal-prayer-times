<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' file:; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hilal Prayer Times</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../assets/logo.svg" alt="">
    <div class="top-text">
      <div class="app-name" data-i18n="appName"></div>
      <div class="loc-row">
        <button class="loc-btn" id="locBtn" type="button"><span id="locLabel"></span></button>
        <span class="wx" id="wx" hidden></span>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button"></button>
    <div class="win-btns" id="winBtns" hidden>
      <button type="button" id="winMin" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg></button>
      <button type="button" id="winClose" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText"></span>
    <button type="button" id="bannerStop" data-i18n="stopAdhan"></button>
  </div>

  <main>
    <!-- Prayer times -->
    <section class="view" id="view-times">
      <div class="hero">
        <div class="hero-label" data-i18n="nextPrayer"></div>
        <div class="hero-name" id="heroName">—</div>
        <div class="hero-count" id="heroCount" dir="ltr">--:--:--</div>
        <div class="hero-time" id="heroTime" dir="ltr"></div>
      </div>
      <button type="button" class="ramadan" id="ramadan" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span id="ramadanText"></span>
        <svg class="cal" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      </button>
      <div class="rows" id="rows"></div>
      <div class="foot">
        <div id="dateGreg"></div>
        <div id="dateHijri"></div>
        <div id="qibla"></div>
      </div>
    </section>

    <!-- AI assistant -->
    <section class="view" id="view-ai" hidden>
      <div class="chat" id="chat"></div>
      <div class="chat-note" data-i18n="aiDisclaimer"></div>
      <form class="chat-form" id="chatForm">
        <button type="button" class="ghost" id="newChat" data-i18n="newChat"></button>
        <textarea id="chatInput" rows="1" data-i18n-ph="aiPlaceholder"></textarea>
        <button type="submit" class="primary" id="chatSend" data-i18n="send"></button>
      </form>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings" hidden>
      <div class="card">
        <h2 data-i18n="location"></h2>
        <div class="line"><span class="muted" data-i18n="current"></span><span id="setLoc"></span></div>
        <button type="button" class="ghost wide" id="autoLoc" data-i18n="detectAuto"></button>
        <form class="search" id="citySearch">
          <input type="text" id="cityInput" data-i18n-ph="searchCity">
          <button type="submit" class="primary" data-i18n="search"></button>
        </form>
        <div class="results" id="cityResults"></div>
      </div>

      <div class="card">
        <h2 data-i18n="language"></h2>
        <select id="language">
          <option value="en">English</option>
          <option value="ug">ئۇيغۇرچە</option>
          <option value="nl">Nederlands</option>
          <option value="tr">Türkçe</option>
          <option value="de">Deutsch</option>
          <option value="no">Norsk</option>
          <option value="fr">Français</option>
          <option value="ja">日本語</option>
          <option value="ar">العربية</option>
          <option value="ur">اردو</option>
          <option value="hi">हिन्दी</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ru">Русский</option>
          <option value="uz">Oʻzbekcha</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ko">한국어</option>
          <option value="fi">Suomi</option>
          <option value="sv">Svenska</option>
        </select>
      </div>

      <div class="card">
        <h2 data-i18n="adhanSection"></h2>
        <label class="line"><span data-i18n="playAdhan"></span><input type="checkbox" id="adhanEnabled"></label>
        <label class="line"><span data-i18n="volume"></span><input type="range" id="volume" min="0" max="1" step="0.05"></label>
        <label class="line"><span data-i18n="adhanFile"></span><select id="adhanChoice"></select></label>
        <div class="btns">
          <button type="button" class="ghost" id="pickAdhan" data-i18n="chooseFile"></button>
          <button type="button" class="ghost" id="testAdhan" data-i18n="test"></button>
        </div>
        <div class="line"><span data-i18n="fajrAdhan"></span><button type="button" class="ghost" id="testFajr" data-i18n="test"></button></div>
      </div>

      <div class="card">
        <h2 data-i18n="calculation"></h2>
        <label class="line"><span data-i18n="method"></span><select id="method"></select></label>
        <label class="line"><span data-i18n="asrMethod"></span>
          <select id="madhab">
            <option value="standard" data-i18n="asrStandard"></option>
            <option value="hanafi" data-i18n="asrHanafi"></option>
          </select>
        </label>
        <label class="line"><span data-i18n="jumaTime"></span><input type="time" id="jumaTime"></label>
        <label class="line"><span data-i18n="hijriAdjust"></span>
          <select id="hijriAdjust" dir="ltr">
            <option value="-2">-2</option>
            <option value="-1">-1</option>
            <option value="0">0</option>
            <option value="1">+1</option>
            <option value="2">+2</option>
          </select>
        </label>
        <p class="muted small" data-i18n="hijriAdjustHelp"></p>
        <label class="line"><span data-i18n="timeFormat"></span>
          <select id="hour12">
            <option value="24" data-i18n="h24"></option>
            <option value="12" data-i18n="h12"></option>
          </select>
        </label>
      </div>

      <div class="card">
        <h2 data-i18n="general"></h2>
        <label class="line"><span data-i18n="theme"></span>
          <select id="theme">
            <option value="auto" data-i18n="themeAuto"></option>
            <option value="system" data-i18n="themeSystem"></option>
            <option value="day" data-i18n="themeDay"></option>
            <option value="night" data-i18n="themeNight"></option>
            <option value="relaxed" data-i18n="themeRelaxed"></option>
            <option value="emerald" data-i18n="themeEmerald"></option>
            <option value="glassDark" data-i18n="themeGlassDark"></option>
            <option value="glassLight" data-i18n="themeGlassLight"></option>
          </select>
        </label>
        <label class="line" id="glassLine" hidden>
          <span><span data-i18n="glassTransparency"></span> <span class="muted" id="glassPct" dir="ltr"></span></span>
          <input type="range" id="glass" min="0" max="100" step="5">
        </label>
        <label class="line"><span data-i18n="weatherTemp"></span>
          <select id="tempUnit">
            <option value="auto" data-i18n="auto"></option>
            <option value="c">°C</option>
            <option value="f">°F</option>
            <option value="off" data-i18n="weatherOff"></option>
          </select>
        </label>
        <label class="line"><span data-i18n="startup"></span><input type="checkbox" id="startup"></label>
        <label class="line"><span data-i18n="widgetShow"></span><input type="checkbox" id="widget"></label>
        <label class="line"><span data-i18n="widgetTop"></span><input type="checkbox" id="widgetTop"></label>
        <label class="line"><span data-i18n="widgetHadith"></span><input type="checkbox" id="widgetHadith"></label>
        <label class="line"><span data-i18n="hadithRefresh"></span><select id="hadithHours"></select></label>
      </div>

      <div class="card">
        <h2 data-i18n="updatesSection"></h2>
        <div class="line"><span id="updVersion"></span><button type="button" class="primary" id="updBtn" data-i18n="updateBtn"></button></div>
        <label class="line"><span data-i18n="updAuto"></span><input type="checkbox" id="updateCheck"></label>
        <p class="muted small" id="updMsg"></p>
        <button type="button" class="ghost wide" id="updPage" data-i18n="updOpenPage" hidden></button>
      </div>

      <div class="card">
        <h2 data-i18n="familySection"></h2>
        <div id="famNone">
          <p class="muted small" data-i18n="familyIntro"></p>
          <div class="btns">
            <button type="button" class="ghost" id="famParent" data-i18n="roleParentBtn"></button>
            <button type="button" class="ghost" id="famChild" data-i18n="roleChildBtn"></button>
          </div>
          <p class="muted small" id="famWinOnly" data-i18n="childWinOnly"></p>
          <form class="stack" id="famSetup" hidden>
            <strong id="famSetupRole"></strong>
            <input type="text" id="famName" maxlength="30" data-i18n-ph="childName">
            <input type="password" inputmode="numeric" id="famPin1" data-i18n-ph="pinNew" dir="ltr" autocomplete="off">
            <input type="password" inputmode="numeric" id="famPin2" data-i18n-ph="pinAgain" dir="ltr" autocomplete="off">
            <p class="small err" id="famSetupMsg"></p>
            <div class="btns">
              <button type="button" class="ghost" id="famSetupCancel" data-i18n="cancel"></button>
              <button type="submit" class="primary" data-i18n="save"></button>
            </div>
          </form>
        </div>
        <div id="famParentBox" hidden>
          <div data-i18n="roleIsParent"></div>
          <p class="muted small" data-i18n="firewallNote"></p>
          <p class="small err" id="famLinkErr"></p>
          <button type="button" class="ghost wide fam-off" data-i18n="familyOff"></button>
        </div>
        <div id="famChildBox" hidden>
          <div id="famChildIs"></div>
          <p class="muted small" id="famParentSeen"></p>
          <form class="search" id="famRename">
            <input type="text" id="famNameEdit" maxlength="30" data-i18n-ph="childName">
            <button type="submit" class="ghost" data-i18n="save"></button>
          </form>
          <button type="button" class="ghost wide" id="famTest" data-i18n="testLock"></button>
          <button type="button" class="ghost wide" id="famTm"></button>
          <p class="muted small" id="famTmHelp"></p>
          <button type="button" class="ghost wide" id="famQuit" data-i18n="quitApp"></button>
          <button type="button" class="ghost wide fam-off" data-i18n="familyOff"></button>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="aiSection"></h2>
        <div class="line"><span data-i18n="apiKey"></span><span class="muted" id="keyStatus"></span></div>
        <form class="search" id="keyForm">
          <input type="password" id="keyInput" autocomplete="off" placeholder="sk-ant-…" dir="ltr">
          <button type="submit" class="primary" data-i18n="save"></button>
        </form>
        <button type="button" class="ghost wide" id="keyRemove" data-i18n="remove"></button>
        <p class="muted small" data-i18n="apiKeyHelp"></p>
      </div>
      <p class="muted small center" id="version"></p>
    </section>

    <!-- Family panel (parent's computer) -->
    <section class="view" id="view-family" hidden>
      <div class="card">
        <h2 data-i18n="scoreboard"></h2>
        <div id="scoreList"></div>
        <p class="muted small" id="scoreWinner"></p>
        <p class="muted small" data-i18n="scoreNote"></p>
      </div>
      <div class="card parent-only">
        <h2 data-i18n="toConfirm"></h2>
        <div id="pendingList"></div>
      </div>
      <div class="card parent-only">
        <h2 data-i18n="children"></h2>
        <div id="kidList"></div>
      </div>
      <div class="card parent-only">
        <h2 data-i18n="lockSettings"></h2>
        <label class="line"><span data-i18n="lockMinutes"></span><input type="number" id="lockMinutes" min="1" max="120" step="1" dir="ltr"></label>
        <div id="lockFor"></div>
      </div>
      <div class="card parent-only">
        <div class="line"><h2 data-i18n="alerts"></h2><button type="button" class="ghost" id="alertsClear" data-i18n="clear"></button></div>
        <div id="alertList"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="pinModal" hidden>
    <form class="card stack" id="pinForm">
      <h2 data-i18n="pinEnter"></h2>
      <p class="muted small" id="pinWhy"></p>
      <input type="password" inputmode="numeric" id="pinInput" dir="ltr" autocomplete="off">
      <p class="small err" id="pinMsg"></p>
      <div class="btns">
        <button type="button" class="ghost" id="pinCancel" data-i18n="cancel"></button>
        <button type="submit" class="primary" data-i18n="unlock"></button>
      </div>
    </form>
  </div>

  <div class="modal" id="updModal" hidden>
    <div class="card stack">
      <h2 data-i18n="updNewTitle"></h2>
      <div id="updNewText"></div>
      <p class="muted small" id="updNewMsg"></p>
      <div class="btns">
        <button type="button" class="ghost" id="updLater" data-i18n="later"></button>
        <button type="button" class="primary" id="updNow"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="daysModal" hidden>
    <div class="card stack">
      <h2 data-i18n="islamicDays"></h2>
      <div class="days" id="daysList"></div>
      <p class="muted small" data-i18n="daysNote"></p>
      <div class="btns">
        <button type="button" class="primary" id="daysClose" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <button type="button" class="tab active" data-view="times"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18M5 20.5v-5.2c0-4 4-5 7-8.3 3 3.3 7 4.3 7 8.3v5.2M10 20.5v-2.8a2 2 0 0 1 4 0v2.8M12 7V5.2"/><path d="M13.3 1.6a1.7 1.7 0 1 0 0 3 1.5 1.5 0 0 1 0-3z"/></svg><span data-i18n="tabTimes"></span></button>
    <button type="button" class="tab" data-view="ai"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11.5H10.5L6 20v-3.5H4z"/><path d="M12 7.8l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><span data-i18n="tabAi"></span></button>
    <button type="button" class="tab" data-view="family" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.2" cy="9.2" r="2.4"/><path d="M16.5 14.3c2.6.3 4.5 2.7 4.5 5.7"/></svg><span data-i18n="tabFamily"></span></button>
    <button type="button" class="tab" data-view="settings"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="tabSettings"></span></button>
  </nav>

  <audio id="adhan" preload="none"></audio>
  <script src="hijri.js"></script>
  <script src="weather.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
