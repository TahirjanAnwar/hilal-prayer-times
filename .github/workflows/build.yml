name: Build installers

# Runs when a tag like v1.4.0 is pushed (publishing a release does that), or when started
# by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to attach the Mac installer to the release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
      # The Windows installer is built and uploaded from the maintainer's PC; the Mac one
      # can only be built on a Mac, so it is added to the release here.
      - name: Attach the Mac installer to the release
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Hilal Prayer Times ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
